<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda Algorítmica | Equipo 404</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
  <header class="max-w-5xl mx-auto mb-8 flex flex-wrap justify-between items-center gap-4">
    <div>
      <h1 class="text-2xl font-bold text-indigo-400">Agenda Algorítmica — Equipo 404</h1>
      <p class="text-sm text-slate-400">Comparativa: Búsqueda Secuencial vs. Merge Sort + Búsqueda Binaria</p>
    </div>
    <div class="flex gap-2">
      <button id="btn-modo-base" class="px-4 py-2 rounded-lg bg-amber-600 font-semibold text-sm">Modo Base (O(n))</button>
      <button id="btn-modo-dyv" class="px-4 py-2 rounded-lg bg-slate-800 font-semibold text-sm">Divide y Vencerás</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto grid md:grid-cols-3 gap-6">
    <!-- Formulario -->
    <section class="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-3">
      <h2 class="font-semibold text-lg">Nuevo Contacto</h2>
      <input id="input-nombre" type="text" placeholder="Nombre completo" class="w-full p-2 rounded bg-slate-800 border border-slate-700" />
      <input id="input-telefono" type="tel" placeholder="Teléfono" class="w-full p-2 rounded bg-slate-800 border border-slate-700" />
      <input id="input-correo" type="email" placeholder="Correo electrónico" class="w-full p-2 rounded bg-slate-800 border border-slate-700" />
      <button id="btn-guardar" class="w-full py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-semibold">Guardar Contacto</button>
      <p id="mensaje-estado" class="text-xs text-slate-400 min-h-[1.5rem]"></p>
    </section>

    <!-- Buscador y Resultados -->
    <section class="md:col-span-2 bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-4">
      <div class="flex gap-2">
        <input id="input-buscar" type="text" placeholder="Buscar por nombre exacto..." class="flex-1 p-2 rounded bg-slate-800 border border-slate-700" />
        <button id="btn-buscar" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 font-semibold">Buscar</button>
      </div>

      <!-- Tarjetas de Métricas -->
      <div class="grid grid-cols-3 gap-3 text-center">
        <div class="bg-slate-800 p-3 rounded-lg">
          <span class="text-xs text-slate-400 block">Total Contactos</span>
          <strong id="stat-total" class="text-xl text-white">0</strong>
        </div>
        <div class="bg-slate-800 p-3 rounded-lg">
          <span class="text-xs text-slate-400 block">Revisiones</span>
          <strong id="stat-revisiones" class="text-xl text-amber-400">0</strong>
        </div>
        <div class="bg-slate-800 p-3 rounded-lg">
          <span class="text-xs text-slate-400 block">Tiempo (ms)</span>
          <strong id="stat-tiempo" class="text-xl text-emerald-400">0.000</strong>
        </div>
      </div>

      <!-- Benchmark rápido -->
      <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-800">
        <button data-size="1000" class="btn-lote px-3 py-1.5 text-xs rounded bg-slate-800 hover:bg-slate-700">Cargar 1,000</button>
        <button data-size="10000" class="btn-lote px-3 py-1.5 text-xs rounded bg-slate-800 hover:bg-slate-700">Cargar 10,000</button>
        <button data-size="100000" class="btn-lote px-3 py-1.5 text-xs rounded bg-slate-800 hover:bg-slate-700">Cargar 100,000</button>
      </div>

      <ul id="lista-contactos" class="divide-y divide-slate-800 max-h-64 overflow-y-auto text-sm"></ul>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
